# Standalone 9to18.ru stack: UI + site-api. Requires: docker network create edge_net
# Public traffic via ui-edge (Host 9to18.ru).

services:
  site-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: site-api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:8020:8020/tcp"
    networks:
      - edge_net
    restart: unless-stopped

  resume-api:
    build:
      # Repo root so we can COPY shared/ into the image for ai_client.
      context: ..
      dockerfile: nine-to-eighteen/resume/Dockerfile
    container_name: resume-api
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-}
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://host.docker.internal:11434}
      AI_MODEL: ${AI_MODEL:-qwen2.5:1.5b}
      AI_TIMEOUT_SEC: ${AI_TIMEOUT_SEC:-60}
      # Avoid polling core:8002 from standalone 9to18 stack.
      AI_SETTINGS_URL: ${AI_SETTINGS_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BIND_HOST:-127.0.0.1}:8021:8021/tcp"
    networks:
      - edge_net
    restart: unless-stopped

  ui-9to18:
    build:
      context: ./ui
      dockerfile: Dockerfile
      target: production
    container_name: ui-9to18
    ports:
      - "${BIND_HOST:-127.0.0.1}:8200:8200/tcp"
    depends_on:
      - site-api
      - resume-api
    networks:
      - edge_net
    restart: unless-stopped

networks:
  edge_net:
    external: true
    name: edge_net
