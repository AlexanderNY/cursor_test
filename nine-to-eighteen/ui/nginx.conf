server {
    listen 8200;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker DNS: иначе после рестарта gateway nginx держит старый IP → 502 Bad Gateway
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /favicon.ico {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.png {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.svg {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /apple-touch-icon.png {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Resume API (separate service). Must be before /api/ so uploads hit resume-api.
    location /api/resume {
        set $upstream_resume_api resume-api:8021;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_resume_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        client_max_body_size 10m;
    }

    # API → site-api (edge_net). Independent of CopyParse gateway.
    location /api/ {
        set $upstream_site_api site-api:8020;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_site_api;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_request_headers on;
        client_max_body_size 10m;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # В mime.types Alpine нет .mjs, поэтому pyodide.asm.mjs уходит как
    # application/octet-stream и браузер отклоняет dynamic import().
    # Явный types + default_type; короткий кэш, чтобы старый octet-stream не залипал на сутки.
    location /pyodide/ {
        include /etc/nginx/mime.types;
        types {
            application/javascript mjs js;
            application/wasm wasm;
            application/json json;
            application/zip zip;
        }
        default_type application/javascript;
        expires 10m;
        add_header Cache-Control "public, must-revalidate";
    }

    location /bowl/ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
