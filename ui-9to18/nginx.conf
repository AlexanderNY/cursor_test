server {
    listen 8200;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable hashed assets from Vite
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Large WASM / game payloads
    location /pyodide/ {
        expires 1d;
        add_header Cache-Control "public";
    }

    location /bowl/ {
        expires 1h;
        add_header Cache-Control "public";
    }
}
