# Standalone 9to18.ru frontend. Requires: docker network create edge_net
# Reachable from ui-edge as ui-9to18:8200
#
# Canonical sources: nine-to-eighteen/ui (this folder is a deploy pointer).

services:
  ui-9to18:
    build:
      context: ../../nine-to-eighteen/ui
      dockerfile: Dockerfile
      target: production
    container_name: ui-9to18
    # Localhost only — public traffic via ui-edge on edge_net
    ports:
      - "${BIND_HOST:-127.0.0.1}:8200:8200/tcp"
    networks:
      - edge_net
    restart: unless-stopped

networks:
  edge_net:
    external: true
    name: edge_net
