# E2E Tester — один контейнер на локальном ПК.
# Данные: SQLite + артефакты в Docker volume (без отдельного Postgres).
#
#   cp deploy/e2e-tester/.env.example deploy/e2e-tester/.env
#   docker compose -f deploy/e2e-tester/docker-compose.yml --env-file deploy/e2e-tester/.env up -d --build
#
# Панель: http://127.0.0.1:8300
# Сайт на хосте (не в docker): TARGET_UI_URL=http://host.docker.internal:PORT

services:
  tester:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tester
    ports:
      - "127.0.0.1:8300:8300"
    environment:
      SQLITE_PATH: ${SQLITE_PATH:-/data/tester.db}
      TESTER_SECRET_KEY: ${TESTER_SECRET_KEY}
      TARGET_UI_URL: ${TARGET_UI_URL:-https://www.copyparse.ru}
      TARGET_API_URL: ${TARGET_API_URL:-}
      ARTIFACTS_DIR: /data/artifacts
    volumes:
      - tester_data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  tester_data:
