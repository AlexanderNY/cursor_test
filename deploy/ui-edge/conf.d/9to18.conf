server {
    listen 80;
    server_name 9to18.ru www.9to18.ru;

    # Independent site-api (no CopyParse gateway /auth)
    location ~ ^/api/(learn|site)(/|$) {
        set $upstream_site_api site-api:8020;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_site_api;
        include /etc/nginx/includes/proxy-api-gateway.conf;
    }

    location ~ ^/api/resume(/|$) {
        set $upstream_resume_api resume-api:8021;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_resume_api;
        include /etc/nginx/includes/proxy-api-gateway.conf;
    }

    location / {
        set $upstream_9to18 ui-9to18:8200;
        proxy_pass http://$upstream_9to18;
        include /etc/nginx/includes/proxy-ui.conf;
    }
}

server {
    listen 443 ssl;
    server_name 9to18.ru www.9to18.ru;

    ssl_certificate     /etc/nginx/certs/9to18/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/9to18/privkey.pem;

    location ~ ^/api/(learn|site)(/|$) {
        set $upstream_site_api site-api:8020;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_site_api;
        include /etc/nginx/includes/proxy-api-gateway.conf;
    }

    location ~ ^/api/resume(/|$) {
        set $upstream_resume_api resume-api:8021;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$upstream_resume_api;
        include /etc/nginx/includes/proxy-api-gateway.conf;
    }

    location / {
        set $upstream_9to18 ui-9to18:8200;
        proxy_pass http://$upstream_9to18;
        include /etc/nginx/includes/proxy-ui.conf;
    }
}
