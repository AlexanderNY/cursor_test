# Отклоняет запросы с неизвестным Host (не copyparse, не site2).
# Для HTTPS нужен любой валидный сертификат — используем copyparse.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/copyparse/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/copyparse/privkey.pem;

    return 444;
}
