# Local all-in-one: copyparse + 9to18 (UI + site-api) + ui-edge on edge_net
# Usage:
#   .\deploy\scripts\create-edge-net.ps1
#   .\deploy\ui-edge\scripts\gen-self-signed.ps1   # if certs missing
#   docker compose -f docker-compose.yaml -f docker-compose.dev.yaml up -d
#
# Prefer standalone: docker compose -f nine-to-eighteen/docker-compose.yml up -d

services:
  site-api:
    build:
      context: ./nine-to-eighteen/api
      dockerfile: Dockerfile
    container_name: site-api
    env_file:
      - path: ./nine-to-eighteen/.env
        required: false
    environment:
      DATABASE_URL: ${SITE_DATABASE_URL:-${DATABASE_URL:-}}
      JWT_SECRET_KEY: ${SITE_JWT_SECRET_KEY:-${JWT_SECRET_KEY:-}}
    ports:
      - "${BIND_HOST:-127.0.0.1}:8020:8020/tcp"
    networks:
      edge_net:
        aliases:
          - site-api
    restart: unless-stopped

  ui-9to18:
    build:
      context: ./nine-to-eighteen/ui
      dockerfile: Dockerfile
      target: production
    container_name: ui-9to18
    ports:
      - "${BIND_HOST:-127.0.0.1}:8200:8200/tcp"
    depends_on:
      - site-api
    networks:
      edge_net:
        aliases:
          - ui-9to18
    restart: unless-stopped

  ui-edge:
    image: nginx:1.27-alpine
    container_name: ui-edge
    depends_on:
      - ui
      - ui-9to18
      - site-api
      - gateway
    ports:
      - "${BIND_HOST:-0.0.0.0}:80:80/tcp"
      - "${BIND_HOST:-0.0.0.0}:443:443/tcp"
    volumes:
      - ./deploy/ui-edge/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/ui-edge/includes:/etc/nginx/includes:ro
      - ${UI_SSL_CERT_DIR:-./deploy/ui-edge/certs}:/etc/nginx/certs:ro
    networks:
      - edge_net
    restart: unless-stopped
