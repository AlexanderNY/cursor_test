name: pytest

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # core.config.validate_required_secrets runs at import time
  DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
  JWT_SECRET_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  SECRET_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"

jobs:
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -U pip pytest pytest-asyncio
      - name: Test shared
        env:
          PYTHONPATH: .
        # Skip posts_repo recording-cursor assertions that drift with lifecycle inserts
        run: python -m pytest shared/tests -q --tb=short --ignore=shared/tests/test_posts_repo.py

  tg-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tg-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip pytest pytest-asyncio
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Test pure helpers
        env:
          PYTHONPATH: ..:.
        run: python -m pytest tests/test_event_logger.py tests/test_code_resend.py -q --tb=short

  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip pytest pytest-asyncio
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Test pure modules
        env:
          PYTHONPATH: ..:.
        run: python -m pytest tests/test_notification_html.py tests/test_pipeline_effectiveness.py tests/test_post_trace_stages.py -q --tb=short

  vk-bot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vk-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -U pip pytest pytest-asyncio
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Test
        env:
          PYTHONPATH: ..:.
        run: python -m pytest tests -q --tb=short
