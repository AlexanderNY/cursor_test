<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E2E Tester</title>
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
  <header class="top">
    <div>
      <h1>E2E Tester</h1>
      <p class="muted" id="health-line">Loading…</p>
    </div>
  </header>

  <nav class="tabs">
    <button type="button" class="tab active" data-tab="credentials">Credentials</button>
    <button type="button" class="tab" data-tab="scenarios">Scenarios</button>
    <button type="button" class="tab" data-tab="runs">Runs</button>
  </nav>

  <main>
    <section id="tab-credentials" class="panel active">
      <h2>Credentials</h2>
      <form id="cred-form" class="card form-grid">
        <label>Name <input name="name" required placeholder="admin_user" /></label>
        <label>Type
          <select name="cred_type" id="cred-type">
            <option value="password">password</option>
            <option value="jwt">jwt</option>
          </select>
        </label>
        <div id="cred-password-fields" class="form-grid full">
          <label>Username <input name="username" autocomplete="username" /></label>
          <label>Password <input name="password" type="password" autocomplete="current-password" /></label>
        </div>
        <div id="cred-jwt-fields" class="form-grid full hidden">
          <label class="full">Access token <textarea name="access_token" rows="2"></textarea></label>
          <label class="full">Refresh token <textarea name="refresh_token" rows="2"></textarea></label>
        </div>
        <label class="full">Meta <input name="meta" placeholder="optional note" /></label>
        <button type="submit">Save credential</button>
      </form>
      <div id="cred-list" class="list"></div>
    </section>

    <section id="tab-scenarios" class="panel">
      <h2>Scenarios</h2>
      <form id="scenario-form" class="card form-grid">
        <label>Name <input name="name" required placeholder="login_smoke" /></label>
        <label>Format
          <select name="format">
            <option value="yaml">yaml</option>
            <option value="json">json</option>
            <option value="playwright_py">playwright_py</option>
          </select>
        </label>
        <label>Default credentials
          <select name="credentials_id" id="scenario-cred-select">
            <option value="">— none —</option>
          </select>
        </label>
        <label class="full">Source
          <textarea name="source" id="scenario-source" rows="14" required placeholder="name: login_smoke&#10;steps:&#10;  - action: login_form"></textarea>
        </label>
        <label>Or upload file <input type="file" id="scenario-file" accept=".yaml,.yml,.json,.py,text/*" /></label>
        <button type="submit">Save scenario</button>
      </form>
      <div id="scenario-list" class="list"></div>
    </section>

    <section id="tab-runs" class="panel">
      <h2>Runs</h2>
      <form id="run-form" class="card form-grid">
        <label>Scenario
          <select name="scenario_id" id="run-scenario-select" required></select>
        </label>
        <label>Credentials override
          <select name="credentials_id" id="run-cred-select">
            <option value="">— scenario default —</option>
          </select>
        </label>
        <button type="submit">Start run</button>
      </form>
      <div class="split">
        <div>
          <h3>History</h3>
          <div id="run-list" class="list"></div>
        </div>
        <div>
          <h3>Selected run <span id="run-status" class="badge"></span></h3>
          <pre id="run-logs" class="logs"></pre>
          <div id="run-artifacts" class="artifacts"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>
  <script src="/assets/app.js"></script>
</body>
</html>
