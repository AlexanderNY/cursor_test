# docker-compose.yml
services:
  core:
    build:
      context: .
      dockerfile: ./core/Dockerfile
    depends_on:
      - minio
    ports:
      - "8002:8002"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=core_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=uploads
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=password123
      - S3_USE_SSL=false
      - API_GATEWAY_URL=http://gateway:8000
      - VK_PUBLIC_GATEWAY_URL=${VK_PUBLIC_GATEWAY_URL:-http://localhost:8000}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8100}
      - VK_APP_ID=${VK_APP_ID:-}
      - VK_APP_SECRET=${VK_APP_SECRET:-}
      - VK_OAUTH_REDIRECT_URI=${VK_OAUTH_REDIRECT_URI:-}
      - AUTH_SERVICE_URL=http://auth:8001
      - TG_BOT_SERVICE_URL=http://tg-bot:8004
      - VK_BOT_SERVICE_URL=http://vk-bot:8005
      - WP_BOT_SERVICE_URL=http://wp-bot:8006
      - URL_BOT_SERVICE_URL=http://url-bot:8007
      - SCHEDULER_SERVICE_URL=http://scheduler:8003
      - COLLECTOR_SERVICE_URL=http://collector:8009
      - PROCESSOR_SERVICE_URL=http://processor:8010
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.2

  auth:
    build: 
      context: .
      dockerfile: ./auth/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - API_GATEWAY_URL=http://api_gateway:8000
      - DATABASE_URL=dbname=db_bot user=postgres password=1qaz!QAZ host=host.docker.internal
      - LOG_SETTINGS_JOURNALD_LEVEL=DEBUG  # Для приложений, которые поддерживают эту переменную
      # Или, например, для Java-приложений
      - LOG_LEVEL=DEBUG
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.1

  gateway:
    build: 
      context: .
      dockerfile: ./api-gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Instagram bot: порт 8011, сервис instagram-bot (не 172.20.10.14:8012 — это другой сервис)
      - INSTAGRAM_BOT_SERVICE_URL=http://instagram-bot:8011
      - THREADS_BOT_SERVICE_URL=http://th-bot:8013
      - DZEN_BOT_SERVICE_URL=http://dzen-bot:8012
      - TW_BOT_SERVICE_URL=http://tw-bot:8011
      - VK_BOT_SERVICE_URL=http://vk-bot:8005
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.250

  scheduler:
    build: 
      context: .
      dockerfile: ./scheduler/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - API_GATEWAY_URL=http://gateway:8000
      - DATABASE_URL=dbname=db_bot user=postgres password=1qaz!QAZ host=host.docker.internal
      - POLL_INTERVAL_SECONDS=60
      - NOTIFY_ON_CHANGE_ONLY=true
      - SCHEDULER_LOGIN=
      - SCHEDULER_PASSWORD=
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.3

  ui:
    build: 
      context: .
      dockerfile: ./ui-app/Dockerfile    
    ports:
      - "8100:8100"
    environment:
      - VITE_API_GATEWAY_URL=http://gateway:8000
      - VITE_AUTH_SERVICE_URL=http://auth:8001
      - VITE_CORE_SERVICE_URL=http://core:8002
      - VITE_SCHEDULER_SERVICE_URL=http://scheduler:8003
      - VITE_TG_BOT_SERVICE_URL=http://tg-bot:8004
      - VITE_VK_BOT_SERVICE_URL=http://vk-bot:8005
      - VITE_WP_BOT_SERVICE_URL=http://wp-bot:8006
      - VITE_URL_BOT_SERVICE_URL=http://url-bot:8007
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.100

  wp-bot:
    build: 
      context: .
      dockerfile: ./wp-bot/Dockerfile 
    ports:
      - "8006:8006"
    environment:
      - VITE_API_GATEWAY_URL=http://gateway:8000
      - VITE_CORE_SERVICE_URL=http://core:8002
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.6

  url-bot:
    build: 
      context: .
      dockerfile: ./url-bot/Dockerfile 
    ports:
      - "8007:8007"
    environment:
      - CORE_SERVICE_URL=http://core:8002
      - API_GATEWAY_URL=http://gateway:8000
      - CHROME_BIN=/usr/bin/chromium
      - CHROMEDRIVER_PATH=/usr/bin/chromedriver
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.7



  collector:
    build: 
      context: .
      dockerfile: ./collector/Dockerfile
    ports:
      - "8009:8009"
    environment:
      - DATABASE_URL=dbname=db_bot user=postgres password=1qaz!QAZ host=host.docker.internal
      - COLLECT_INTERVAL_SEC=60
      - DISTRIBUTE_INTERVAL_SEC=60
      - COLLECT_BATCH_SIZE=100
      - DISTRIBUTE_BATCH_SIZE=100
      - LOG_LEVEL=INFO
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.9

  processor:
    build: 
      context: .
      dockerfile: ./processor/Dockerfile
    ports:
      - "8010:8010"
    environment:
      - DATABASE_URL=dbname=db_bot user=postgres password=1qaz!QAZ host=host.docker.internal
      - PROCESS_INTERVAL_SEC=30
      - PROCESS_BATCH_SIZE=50
      - WORDPRESS_MAX_LENGTH=150000
      - TELEGRAM_MAX_LENGTH=4096
      - TWITTER_MAX_LENGTH=280
      - VKONTAKTE_MAX_LENGTH=15985
      - LOG_LEVEL=INFO
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.10

  instagram-bot:
    build:
      context: .
      dockerfile: ./instagram-bot/Dockerfile
    depends_on:
      - minio
    ports:
      - "8011:8011"
    environment:
      - DATABASE_URL=dbname=db_bot user=postgres password=1qaz!QAZ host=host.docker.internal
      - API_PORT=8011
      - LOG_LEVEL=INFO
      - INSTAGRAM_COLLECT_INTERVAL_SEC=300
      - PUBLISH_INTERVAL_SEC=60
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=uploads
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=password123
      - S3_USE_SSL=false
      - CHROME_BIN=/usr/bin/chromium
      - CHROMEDRIVER_PATH=/usr/bin/chromedriver
      # Fallback вход через браузер при сбое instagrapi (см. INSTAGRAM_SELENIUM_FALLBACK_NETWORK_ERRORS_ONLY)
      - INSTAGRAM_SELENIUM_FALLBACK_ENABLED=false
      - INSTAGRAM_SELENIUM_FALLBACK_NETWORK_ERRORS_ONLY=true
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.11
  th-bot:
    build: 
      context: .
      dockerfile: ./th-bot/Dockerfile
    depends_on:
      - minio
    ports:
      - "8013:8013"
    environment:
      - DATABASE_URL=dbname=db_bot user=postgres password=1qaz!QAZ host=host.docker.internal
      - API_PORT=8013
      - LOG_LEVEL=INFO
      - CHROME_BIN=/usr/bin/chromium
      - CHROMEDRIVER_PATH=/usr/bin/chromedriver
      # Диагностический веб-вход Meta (не заменяет OAuth); по умолчанию выключено
      - ENABLE_THREADS_SELENIUM_FALLBACK=false
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=uploads
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=password123
      - S3_USE_SSL=false
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.13

  tw-bot:
    build: 
      context: .
      dockerfile: ./tw-bot/Dockerfile 
    depends_on:
      - minio
    ports:
      - "8014:8011"
    environment:
      - DATABASE_URL=dbname=db_bot user=postgres password=1qaz!QAZ host=host.docker.internal
      - API_PORT=8011
      - LOG_LEVEL=INFO
      - CHROME_BIN=/usr/bin/chromium
      - CHROMEDRIVER_PATH=/usr/bin/chromedriver
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=uploads
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=password123
      - S3_USE_SSL=false
    shm_size: "2gb"
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.14

  tg-bot:
    build: 
      context: .
      dockerfile: ./tg-bot/Dockerfile
    depends_on:
      - minio
    ports:
      - "8004:8004"
    environment:
      - CORE_SERVICE_URL=http://core:8002
      - API_GATEWAY_URL=http://gateway:8000
      - DATABASE_URL=dbname=db_bot user=postgres password=1qaz!QAZ host=host.docker.internal
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=uploads
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=password123
      - S3_USE_SSL=false
      - LOG_BOT_ACTIONS=false
      - RELOAD_PROFILES_INTERVAL_SEC=300
      - MAX_CONCURRENT_CLIENTS=20
      - CHROME_BIN=/usr/bin/chromium
      - CHROMEDRIVER_PATH=/usr/bin/chromedriver
      # Игровой бот (BotFather token); пусто — только Telethon + API без aiogram polling.
      - GAME_BOT_TOKEN=
      - GAME_ADMIN_TELEGRAM_IDS=
      - GAME_ADMIN_API_TOKEN=
    volumes:
      - tg-bot-sessions:/app/sessions
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.4

  vk-bot:
    build: 
      context: .
      dockerfile: ./vk-bot/Dockerfile
    depends_on:
      - minio
    shm_size: "1gb"
    ports:
      - "8005:8005"
    environment:
      - CORE_SERVICE_URL=http://core:8002
      - API_GATEWAY_URL=http://gateway:8000
      - DATABASE_URL=dbname=db_bot user=postgres password=1qaz!QAZ host=host.docker.internal
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=uploads
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=password123
      - S3_USE_SSL=false
      - LOG_BOT_ACTIONS=false
      - RELOAD_PROFILES_INTERVAL_SEC=300
      - MAX_CONCURRENT_CLIENTS=20
      - CHROME_BIN=/usr/bin/chromium
      - CHROMEDRIVER_PATH=/usr/bin/chromedriver
      - SELENIUM_HEADLESS=true
      - SELENIUM_PAGE_LOAD_TIMEOUT=90
    volumes:
      - tg-bot-sessions:/app/sessions
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.5

  dzen-bot:
    build: 
      context: .
      dockerfile: ./dzen-bot/Dockerfile     
    ports:
      - "8012:8012"
    environment:
      - DATABASE_URL=dbname=db_bot user=postgres password=1qaz!QAZ host=host.docker.internal
      - API_PORT=8012
      - LOG_LEVEL=INFO
      - S3_ENDPOINT_URL=http://minio:9000
      - S3_BUCKET=uploads
      - S3_ACCESS_KEY=admin
      - S3_SECRET_KEY=password123
      - S3_USE_SSL=false
      - S3_DIAG_PREFIX=dzen/diag
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.12

  minio:
    image: minio/minio
    ports:
      - "9000:9000"  # api
      - "9001:9001"  # web UI
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    volumes:
      - ./minio_data:/data  # папка на вашем диске для хранения файлов
    command: server /data --console-address ":9001"
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.200


volumes:
  postgres_data:
  tg-bot-sessions:
  tg-bot-uploads:
  instagram-bot-uploads:

networks:
  monitoring_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16