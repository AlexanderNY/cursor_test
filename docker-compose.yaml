# docker-compose.yml

# Публичный URL для OAuth/redirect (IP роутера). Проброс NAT: 95.165.87.163 → 192.168.1.66
x-public-url: &public-url "http://95.165.87.163"

# IP привязки портов на хосте (LAN-IP ПК или 0.0.0.0). НЕ ставьте сюда IP роутера.
x-bind-host: &bind-host "${BIND_HOST:-0.0.0.0}"

# UI/API only on loopback for direct debug; public traffic goes through ui-edge (edge_net).
x-ui-public-ports: &ui-public-ports
  - "127.0.0.1:8100:8100/tcp"
  - "127.0.0.1:8100:8100/udp"

x-ai-environment: &ai-environment
  AI_SERVICE_URL: http://ollama:11434
  AI_MODEL: qwen2.5:3b
  AI_TIMEOUT_SEC: "60"
  AI_REALTIME_TIMEOUT_SEC: "15"
  # Kill-switch поверх тоггла Checks → AI. По умолчанию true — иначе UI «Включена», а запросы падают.
  AI_ENABLED: "${AI_ENABLED:-true}"
  CORE_SERVICE_URL: http://core:8002
  AI_SETTINGS_URL: http://core:8002/internal/ai-enabled

services:
  core:
    build:
      context: .
      dockerfile: ./core/Dockerfile
    depends_on:
      minio:
        condition: service_started
    ports:
      # Только localhost: не публиковать Core наружу (иначе X-User-* spoof в обход gateway)
      - "127.0.0.1:8002:8002"
    environment:
      <<: *ai-environment
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      S3_BUCKET: uploads
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_USE_SSL: "false"
      API_GATEWAY_URL: http://gateway:8000
      # Публичный URL API для VK OAuth (через ui-edge: /api → gateway). Локально: http://localhost:8100/api
      VK_PUBLIC_GATEWAY_URL: ${VK_PUBLIC_GATEWAY_URL:-https://www.copyparse.ru/api}
      FRONTEND_URL: ${FRONTEND_URL:-https://www.copyparse.ru}
      VK_APP_ID: ${VK_APP_ID:-}
      VK_APP_SECRET: ${VK_APP_SECRET:-}
      # VK_OAUTH_REDIRECT_URI не задавать — Core строит {VK_PUBLIC_GATEWAY_URL}/vk/oauth/callback
      AUTH_SERVICE_URL: http://auth:8001
      TG_BOT_SERVICE_URL: http://tg-bot:8004
      VK_BOT_SERVICE_URL: http://vk-bot:8005
      WP_BOT_SERVICE_URL: http://wp-bot:8006
      URL_BOT_SERVICE_URL: http://url-bot:8007
      SCHEDULER_SERVICE_URL: http://scheduler:8003
      COLLECTOR_SERVICE_URL: http://collector:8009
      PROCESSOR_SERVICE_URL: http://processor:8010
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.2

  auth:
    build: 
      context: .
      dockerfile: ./auth/Dockerfile
    ports:
      # Только localhost: не публиковать Auth наружу (иначе identity spoof в обход gateway)
      - "127.0.0.1:8001:8001"
    environment:
      - API_GATEWAY_URL=http://api_gateway:8000
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - LOG_SETTINGS_JOURNALD_LEVEL=DEBUG  # Для приложений, которые поддерживают эту переменную
      # Или, например, для Java-приложений
      - LOG_LEVEL=DEBUG
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.1

  gateway:
    build: 
      context: .
      dockerfile: ./api-gateway/Dockerfile
    container_name: gateway
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Instagram bot: порт 8011, сервис instagram-bot (не 172.20.10.14:8012 — это другой сервис)
      - INSTAGRAM_BOT_SERVICE_URL=http://instagram-bot:8011
      - THREADS_BOT_SERVICE_URL=http://th-bot:8013
      - DZEN_BOT_SERVICE_URL=http://dzen-bot:8012
      - TW_BOT_SERVICE_URL=http://tw-bot:8011
      - VK_BOT_SERVICE_URL=http://vk-bot:8005
      - TG_GAME_SERVICE_URL=http://tg-game:8015
      - GAME_ADMIN_API_TOKEN=122
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:8100,http://127.0.0.1:8100,http://192.168.1.66,http://192.168.1.66:8100,http://95.165.87.163,https://95.165.87.163,http://copyparse.ru,https://copyparse.ru,http://www.copyparse.ru,https://www.copyparse.ru
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.250
      edge_net:
        aliases:
          - gateway

  scheduler:
    build: 
      context: .
      dockerfile: ./scheduler/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - API_GATEWAY_URL=http://gateway:8000
      - CORE_SERVICE_URL=http://core:8002
      - DATABASE_URL=${DATABASE_URL}
      - POLL_INTERVAL_SECONDS=60
      - NOTIFY_ON_CHANGE_ONLY=true
      - TG_BOT_SERVICE_URL=http://tg-bot:8004
      - WP_BOT_SERVICE_URL=http://wp-bot:8006
      - VK_BOT_SERVICE_URL=http://vk-bot:8005
      - TW_BOT_SERVICE_URL=http://tw-bot:8011
      - URL_BOT_SERVICE_URL=http://url-bot:8007
      - THREADS_BOT_SERVICE_URL=http://th-bot:8013
      - DZEN_BOT_SERVICE_URL=http://dzen-bot:8012
      - INSTAGRAM_BOT_SERVICE_URL=http://instagram-bot:8011
      - TZ=${TZ:-Europe/Moscow}
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.3

  ui:
    build: 
      context: .
      dockerfile: ./ui-app/Dockerfile
    container_name: ui
    ports: *ui-public-ports
    environment:
      - VITE_API_GATEWAY_URL=http://gateway:8000
      - VITE_AUTH_SERVICE_URL=http://auth:8001
      - VITE_CORE_SERVICE_URL=http://core:8002
      - VITE_SCHEDULER_SERVICE_URL=http://scheduler:8003
      - VITE_TG_BOT_SERVICE_URL=http://tg-bot:8004
      - VITE_VK_BOT_SERVICE_URL=http://vk-bot:8005
      - VITE_WP_BOT_SERVICE_URL=http://wp-bot:8006
      - VITE_URL_BOT_SERVICE_URL=http://url-bot:8007
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.100
      edge_net:
        aliases:
          - ui

  wp-bot:
    build: 
      context: .
      dockerfile: ./wp-bot/Dockerfile 
    ports:
      - "8006:8006"
    environment:
      <<: *ai-environment
      DATABASE_URL: ${DATABASE_URL}
      VITE_API_GATEWAY_URL: http://gateway:8000
      VITE_CORE_SERVICE_URL: http://core:8002
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.6

  url-bot:
    build: 
      context: .
      dockerfile: ./url-bot/Dockerfile 
    ports:
      - "8007:8007"
    environment:
      <<: *ai-environment
      CORE_SERVICE_URL: http://core:8002
      API_GATEWAY_URL: http://gateway:8000
      CHROME_BIN: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
      TZ: ${TZ:-Europe/Moscow}
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.7



  collector:
    build: 
      context: .
      dockerfile: ./collector/Dockerfile
    ports:
      - "8009:8009"
    environment:
      <<: *ai-environment
      DATABASE_URL: ${DATABASE_URL}
      COLLECT_INTERVAL_SEC: "60"
      DISTRIBUTE_INTERVAL_SEC: "60"
      COLLECT_BATCH_SIZE: "100"
      DISTRIBUTE_BATCH_SIZE: "100"
      LOG_LEVEL: INFO
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.9

  processor:
    build: 
      context: .
      dockerfile: ./processor/Dockerfile
    ports:
      - "8010:8010"
    environment:
      <<: *ai-environment
      DATABASE_URL: ${DATABASE_URL}
      PROCESS_INTERVAL_SEC: "30"
      PROCESS_BATCH_SIZE: "50"
      WORDPRESS_MAX_LENGTH: "150000"
      TELEGRAM_MAX_LENGTH: "4096"
      TWITTER_MAX_LENGTH: "280"
      VKONTAKTE_MAX_LENGTH: "15985"
      LOG_LEVEL: INFO
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.10

  ollama:
    image: ollama/ollama:latest
    gpus: all
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.20

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen2.5:3b
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for Ollama at $$OLLAMA_HOST..."
        elapsed=0
        until ollama list >/dev/null 2>&1; do
          if [ $$elapsed -ge 300 ]; then
            echo "Ollama timeout"
            exit 1
          fi
          sleep 2
          elapsed=$$((elapsed + 2))
        done
        echo "Pulling $$OLLAMA_MODEL..."
        ollama pull "$$OLLAMA_MODEL"
        echo "Model $$OLLAMA_MODEL is ready."
    restart: "no"
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.21

  instagram-bot:
    build:
      context: .
      dockerfile: ./instagram-bot/Dockerfile
    depends_on:
      - minio
    ports:
      - "8011:8011"
    environment:
      <<: *ai-environment
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: "8011"
      LOG_LEVEL: INFO
      INSTAGRAM_COLLECT_INTERVAL_SEC: "300"
      PUBLISH_INTERVAL_SEC: "60"
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: uploads
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_USE_SSL: "false"
      CHROME_BIN: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
      INSTAGRAM_SELENIUM_FALLBACK_ENABLED: "false"
      INSTAGRAM_SELENIUM_FALLBACK_NETWORK_ERRORS_ONLY: "true"
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.11
  th-bot:
    build: 
      context: .
      dockerfile: ./th-bot/Dockerfile
    depends_on:
      - minio
    ports:
      - "8013:8013"
    environment:
      <<: *ai-environment
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: "8013"
      LOG_LEVEL: INFO
      CHROME_BIN: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
      ENABLE_THREADS_SELENIUM_FALLBACK: "false"
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: uploads
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_USE_SSL: "false"
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.13

  tw-bot:
    build: 
      context: .
      dockerfile: ./tw-bot/Dockerfile 
    depends_on:
      - minio
    ports:
      - "8014:8011"
    environment:
      <<: *ai-environment
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: "8011"
      LOG_LEVEL: INFO
      CHROME_BIN: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: uploads
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_USE_SSL: "false"
    shm_size: "2gb"
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.14

  tg-bot:
    build: 
      context: .
      dockerfile: ./tg-bot/Dockerfile
    depends_on:
      minio:
        condition: service_started
    ports:
      - "8004:8004"
    environment:
      <<: *ai-environment
      CORE_SERVICE_URL: http://core:8002
      API_GATEWAY_URL: http://gateway:8000
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: uploads
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_USE_SSL: "false"
      LOG_BOT_ACTIONS: "false"
      RELOAD_PROFILES_INTERVAL_SEC: "300"
      MAX_CONCURRENT_CLIENTS: "20"
      # SOCKS5/HTTP proxy for Telethon when MTProto is blocked (Clash etc.)
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      CHROME_BIN: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
    volumes:
      - tg-bot-sessions:/app/sessions
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.4

  tg-game:
    build:
      context: .
      dockerfile: ./tg-game/Dockerfile
    depends_on:
      - minio
    ports:
      - "8015:8015"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: "8015"
      LOG_LEVEL: INFO
      GAME_BOT_TOKEN: "6951168264:AAGaXyK4Bi3jiyZHm8yiN4LI6cg2UZ0pPV0"
      GAME_ADMIN_TELEGRAM_IDS: "426287794"
      GAME_ADMIN_API_TOKEN: "122"
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: uploads
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_USE_SSL: "false"
      GAME_MEDIA_PUBLIC_BASE_URL: https://www.copyparse.ru
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.8

  vk-bot:
    build: 
      context: .
      dockerfile: ./vk-bot/Dockerfile
    depends_on:
      - minio
    shm_size: "1gb"
    ports:
      - "8005:8005"
    environment:
      <<: *ai-environment
      CORE_SERVICE_URL: http://core:8002
      API_GATEWAY_URL: http://gateway:8000
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: uploads
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_USE_SSL: "false"
      LOG_BOT_ACTIONS: "false"
      RELOAD_PROFILES_INTERVAL_SEC: "300"
      MAX_CONCURRENT_CLIENTS: "20"
      CHROME_BIN: /usr/bin/chromium
      CHROMEDRIVER_PATH: /usr/bin/chromedriver
      SELENIUM_HEADLESS: "true"
      SELENIUM_PAGE_LOAD_TIMEOUT: "90"
    volumes:
      - tg-bot-sessions:/app/sessions
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.5

  dzen-bot:
    build: 
      context: .
      dockerfile: ./dzen-bot/Dockerfile     
    ports:
      - "8012:8012"
    environment:
      <<: *ai-environment
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: "8012"
      LOG_LEVEL: INFO
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: uploads
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-admin}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_USE_SSL: "false"
      S3_DIAG_PREFIX: dzen/diag
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.12

  minio:
    image: minio/minio
    ports:
      - "9000:9000"  # api
      - "9001:9001"  # web UI
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Чтобы Console/ссылки открывались с хоста, а не как http://minio:9000
      MINIO_SERVER_URL: ${MINIO_SERVER_URL:-http://localhost:9000}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-http://localhost:9001}
    volumes:
      - ./minio_data:/data  # папка на вашем диске для хранения файлов
    command: server /data --console-address ":9001"
    networks:
      monitoring_network:
        ipv4_address: 172.20.10.200


volumes:
  postgres_data:
  tg-bot-sessions:
  tg-bot-uploads:
  instagram-bot-uploads:
  ollama_data:

networks:
  monitoring_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  # Shared with deploy/ui-edge and ui-9to18. Create once: deploy/scripts/create-edge-net.ps1
  edge_net:
    external: true
    name: edge_net