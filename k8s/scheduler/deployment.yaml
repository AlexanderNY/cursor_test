apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: app
  labels:
    app: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler
  template:
    metadata:
      labels:
        app: scheduler
    spec:
      containers:
        - name: scheduler
          image: scheduler:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8003
          env:
            - name: API_GATEWAY_URL
              value: "http://gateway:8000"
            - name: POLL_INTERVAL_SECONDS
              value: "60"
            - name: NOTIFY_ON_CHANGE_ONLY
              value: "true"
          envFrom:
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8003
            initialDelaySeconds: 15
            periodSeconds: 15
