apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
  namespace: app
  labels:
    app: processor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: processor
  template:
    metadata:
      labels:
        app: processor
    spec:
      containers:
        - name: processor
          image: processor:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8010
          env:
            - name: PROCESS_INTERVAL_SEC
              value: "30"
            - name: PROCESS_BATCH_SIZE
              value: "50"
            - name: LOG_LEVEL
              value: "INFO"
          envFrom:
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 15
            periodSeconds: 15
