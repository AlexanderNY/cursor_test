apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  namespace: app
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Strip /api prefix so gateway receives /auth/login etc.
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
    # For Minikube: use minikube ip and e.g. app.$(minikube ip).nip.io or add /etc/hosts
    - http:
        paths:
          # API: /api/* -> gateway (backend receives /*)
          - path: /api/(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: gateway
                port:
                  number: 8000
          # UI: everything else -> ui
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 8100
