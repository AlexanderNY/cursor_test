apiVersion: apps/v1
kind: Deployment
metadata:
  name: th-bot
  namespace: app
  labels:
    app: th-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: th-bot
  template:
    metadata:
      labels:
        app: th-bot
    spec:
      containers:
        - name: th-bot
          image: th-bot:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8011
          env:
            - name: LOG_LEVEL
              value: "INFO"
          envFrom:
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8011
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8011
            initialDelaySeconds: 15
            periodSeconds: 15
